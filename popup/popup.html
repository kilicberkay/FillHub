<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Filler Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }

        .btn-gradient:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
        }

        @keyframes glow {

            0%,
            100% {
                box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
            }

            50% {
                box-shadow: 0 0 25px rgba(99, 102, 241, 0.7);
            }
        }

        .animate-glow {
            animation: glow 2s infinite;
        }
    </style>
</head>

<body class="w-[360px] bg-[#0c0e14] text-gray-200 antialiased">
    <div class="p-6">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-3">
                <div
                    class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400">
                        Fake Filler</h1>
                    <p class="text-[10px] text-gray-500 tracking-widest uppercase font-semibold">Pro Edition v1.0</p>
                </div>
            </div>
            <button id="settingsBtn" class="p-2.5 rounded-xl glass hover:bg-white/10 transition-all">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </div>

        <!-- Main Content -->
        <div class="space-y-6">
            <!-- Locale Card -->
            <div class="glass p-5 rounded-[24px]">
                <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-widest mb-3">Country
                    Selection</label>

                <div class="mb-3">
                    <input type="text" id="countrySearch" placeholder="Search country..."
                        class="w-full bg-[#161922] border border-white/5 rounded-xl px-4 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500/50 transition-all">
                </div>

                <div class="relative group">
                    <select id="localeSelect"
                        class="w-full bg-[#161922] border border-white/5 rounded-xl px-4 py-3 text-sm appearance-none focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all cursor-pointer max-h-40">
                        <!-- Dynamically populated -->
                    </select>
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-gray-500">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </div>
                </div>
                <p id="systemLangNotice" class="text-[10px] text-gray-600 mt-2 italic px-1"></p>
            </div>

            <!-- Action Button -->
            <button id="fillBtn"
                class="btn-gradient w-full py-4 rounded-xl font-bold text-white shadow-xl shadow-indigo-500/20 active:scale-95 transition-all text-sm animate-glow flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                </svg>
                Fill All Form Fields
            </button>

            <!-- Footer Info -->
            <div class="flex items-center justify-between text-[11px] text-gray-500 px-1 pt-2">
                <div class="flex items-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                    Ready to Fill
                </div>
                <div class="flex items-center gap-1">
                    <kbd class="px-1.5 py-0.5 rounded border border-white/10 bg-white/5 text-[9px]">ALT</kbd>
                    <span>+</span>
                    <kbd class="px-1.5 py-0.5 rounded border border-white/10 bg-white/5 text-[9px]">SHIFT</kbd>
                    <span>+</span>
                    <kbd class="px-1.5 py-0.5 rounded border border-white/10 bg-white/5 text-[9px]">F</kbd>
                </div>
            </div>
        </div>
    </div>
    <script src="../scripts/generator.js"></script>
    <script src="popup.js"></script>
</body>

</html>
