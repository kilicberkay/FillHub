name: Translation
description: Suggest a better translation, or translate into a language that is missing
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: "e.g. Turkish (tr)"
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: Key and suggested text
      description: "Use the key from options/i18n.js, for example: profileSaveBtn → Kaydet"
      render: text
    validations:
      required: true
  - type: checkboxes
    id: native
    attributes:
      label: Review
      options:
        - label: I am a native speaker of this language, or I checked the text with one.
