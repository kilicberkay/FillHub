<!doctype html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FillHub 中文表单</title>
</head>
<body>
    <form id="kayit" action="#">
        <label for="soyad">姓</label>
        <input id="soyad" name="soyad" type="text">
        <label for="ad">名</label>
        <input id="ad" name="ad" type="text">
        <label for="eposta">邮箱</label>
        <input id="eposta" name="eposta" type="email">
        <label for="tel">手机号</label>
        <input id="tel" name="tel" type="tel">
        <label for="sehir">城市</label>
        <input id="sehir" name="sehir" type="text">
        <button type="submit">提交</button>
    </form>
</body>
</html>
