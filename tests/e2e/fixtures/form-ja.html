<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FillHub 日本語フォーム</title>
</head>
<body>
    <form id="kayit" action="#">
        <label for="soyad">姓</label>
        <input id="soyad" name="soyad" type="text">
        <label for="ad">名</label>
        <input id="ad" name="ad" type="text">
        <label for="eposta">メールアドレス</label>
        <input id="eposta" name="eposta" type="email">
        <label for="tel">電話番号</label>
        <input id="tel" name="tel" type="tel">
        <label for="posta">郵便番号</label>
        <input id="posta" name="posta" type="text">
        <label for="sehir">市区町村</label>
        <input id="sehir" name="sehir" type="text">
        <label for="adres">住所</label>
        <input id="adres" name="adres" type="text">
        <button type="submit">送信</button>
    </form>
</body>
</html>
