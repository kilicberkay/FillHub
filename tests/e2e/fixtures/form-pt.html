<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulário de demonstração do FillHub</title>
    <style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;background:#f4f4f5;color:#18181b;min-height:100vh}
main{max-width:720px;margin:48px auto;background:#fff;border:1px solid #e4e4e7;border-radius:16px;padding:32px;box-shadow:0 18px 40px -28px rgba(24,24,27,.28)}
h1{font-size:22px;margin:0 0 4px}
p.sub{margin:0 0 24px;color:#52525b;font-size:14px}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:#3f3f46}
label.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:8px;font-weight:400}
input{height:40px;border:1px solid #d4d4d8;border-radius:10px;padding:0 12px;font:inherit;font-size:14px;color:#18181b;background:#fff}
input[type=checkbox]{height:16px;width:16px;margin:0}
button{grid-column:1/-1;justify-self:start;height:40px;padding:0 20px;border:0;border-radius:10px;background:#c2185b;color:#fff;font:inherit;font-weight:600;font-size:14px}
</style>
</head>
<body>
    <main>
    <h1>Formulário de cadastro</h1>
    <p class="sub">Formulário de exemplo a ser preenchido pelo FillHub</p>
    <form id="kayit" action="#">
        <label for="ad">Nome</label>
        <input id="ad" name="ad" type="text">
        <label for="soyad">Sobrenome</label>
        <input id="soyad" name="soyad" type="text">
        <label for="eposta">E-mail</label>
        <input id="eposta" name="eposta" type="email">
        <label for="eposta2">Confirmar e-mail</label>
        <input id="eposta2" name="eposta2" type="email">
        <label for="tel">Celular</label>
        <input id="tel" name="tel" type="tel">
        <label for="tc">Número de identidade</label>
        <input id="tc" name="tc" type="text">
        <label for="sehir">Cidade</label>
        <input id="sehir" name="sehir" type="text">
        <label for="sirket">Empresa</label>
        <input id="sirket" name="sirket" type="text">
        <label><input id="kvkk" type="checkbox" required> Li o aviso de privacidade</label>
        <button type="submit">Enviar</button>
    </form>
    </main>
</body>
</html>
